<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smuggler — prototype</title>
<style>
  :root{--bg:#0c0a08;--panel:#1a140d;--panel2:#140f09;--line:#3a2c18;--ink:#f1e6d3;--dim:#8a7657;--seize:#e0475b;--safe:#3ec98f;--accent:#e0a83e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,Consolas,monospace;display:flex;justify-content:center;padding:32px 16px}
  .wrap{width:520px;max-width:100%}
  h1{font-size:18px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin:0 0 4px}
  .sub{font-size:12px;color:var(--dim);margin-bottom:18px;line-height:1.5}

  .stage{
    height:150px;border:1px solid var(--line);border-radius:8px;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 0%, #241a0e, var(--panel2));
  }
  .belt{
    position:absolute;left:0;right:0;bottom:30px;height:30px;
    background:repeating-linear-gradient(45deg,#2a2013,#2a2013 10px,#231b10 10px,#231b10 20px);
    background-size:200% 100%;animation:roll 1.2s linear infinite;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  @keyframes roll{to{background-position:-28px 0}}
  .beltBags{position:absolute;left:0;right:0;bottom:36px;display:flex;gap:6px;justify-content:center;align-items:flex-end}
  .beltBag{width:26px;height:20px;border-radius:3px;border:2px solid #3a2c18;background:#5c4326;font-size:9px;
    display:flex;align-items:center;justify-content:center;color:#f1e6d3}
  .beltBag.hid{background:#6b4a1f;border-color:var(--accent);box-shadow:0 0 8px rgba(224,168,62,.5)}
  .scanBar{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,#ffb84d,transparent);
    opacity:0;box-shadow:0 0 12px 2px #ffb84d}
  .scanBar.sweep{animation:sweep .48s ease-in-out;opacity:1}
  @keyframes sweep{0%{top:14px}100%{top:120px}}
  .flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;opacity:0;background:rgba(0,0,0,.55);transition:opacity .25s}
  .sign{position:absolute;top:10px;left:12px;font-size:11px;color:var(--dim);z-index:2}
  .odds{position:absolute;top:10px;right:12px;font-size:11px;color:var(--dim);text-align:right;z-index:2;line-height:1.5}
  .odds b{color:var(--ink)}

  .history{display:flex;gap:4px;justify-content:center;margin-top:10px;height:10px}
  .history i{width:10px;height:10px;border-radius:2px;background:#3a2c18}
  .history i.clear{background:var(--safe)}
  .history i.seize{background:var(--seize)}

  .bagsLabel{margin:18px 0 8px;font-size:11px;color:var(--dim);letter-spacing:.1em;display:flex;justify-content:space-between}
  .bags{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .bag{
    background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:12px 4px;text-align:center;
    cursor:pointer;transition:transform .12s,border-color .12s,background .12s;user-select:none;
  }
  .bag:hover{transform:translateY(-3px)}
  .bag .icon{font-size:20px;line-height:1}
  .bag .val{font-size:15px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .bag .state{font-size:9px;letter-spacing:.05em;margin-top:3px;color:var(--dim)}
  .bag.declared{border-color:#2f5c3a;background:rgba(62,201,143,.07)}
  .bag.declared .state{color:var(--safe)}
  .bag.hidden{border-color:var(--accent);background:rgba(224,168,62,.1);box-shadow:0 0 12px rgba(224,168,62,.2)}
  .bag.hidden .state{color:var(--accent)}

  button{width:100%;padding:14px;margin-top:16px;background:var(--accent);border:none;border-radius:8px;color:#1a1206;font:inherit;font-weight:700;letter-spacing:.05em;cursor:pointer}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5;cursor:default}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;font-size:11px}
  .stats div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;color:var(--dim)}
  .stats .v{font-size:14px;color:var(--ink);display:block;margin-top:3px;font-variant-numeric:tabular-nums}

  details{margin-top:16px;font-size:11px;color:var(--dim)}
  summary{cursor:pointer;user-select:none}
  .debug{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.7}
  .debug b{color:var(--ink)}
  .debug .ok{color:var(--safe)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Smuggler</h1>
  <div class="sub">Five bags, different values every crossing. Tap each one to declare it — safe but taxed — or hide it. The more you hide, the harder they look.</div>

  <div class="stage" id="stage">
    <span class="sign">CROSSING #<span id="round">1</span></span>
    <span class="odds" id="odds"></span>
    <div class="belt"></div>
    <div class="beltBags" id="beltBags"></div>
    <div class="scanBar" id="scanBar"></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="history" id="history"></div>

  <div class="bagsLabel"><span>YOUR CARGO — TAP TO HIDE</span><span>STAKE 100</span></div>
  <div class="bags" id="bags"></div>

  <button id="bet">CROSS THE BORDER</button>

  <div class="stats">
    <div>Balance<span class="v" id="balance">10,000</span></div>
    <div>Crossings<span class="v" id="rounds">0</span></div>
    <div>Session RTP<span class="v" id="rtp">—</span></div>
  </div>

  <details>
    <summary>Math self-check (declared RTP vs simulated)</summary>
    <div class="debug" id="debug">running…</div>
  </details>
</div>

<script>
const RTP = 0.96;
const STAKE = 100;
const q0 = 0.10, k = 0.40;   // inspection chance = q0 + k * (hidden share of value)

let balance = 10000, rounds = 0, wagered = 0, paid = 0;
let busy = false, bags = [];

const bagsEl = document.getElementById('bags');
const beltBags = document.getElementById('beltBags');
const flash = document.getElementById('flash');
const scanBar = document.getElementById('scanBar');
const roundEl = document.getElementById('round');
const betBtn = document.getElementById('bet');
const historyEl = document.getElementById('history');
const oddsEl = document.getElementById('odds');

const qOf = h => q0 + k*h;
// With the declared pile returning exactly RTP, the hidden multiplier collapses to RTP/(1-q):
// EV = d*RTP + h*(1-q)*(RTP/(1-q)) = RTP for every possible split. Flat by construction.
const mhOf = h => RTP/(1-qOf(h));

function dealBags(){
  // five random weights normalised to the 100 stake
  const raw = Array.from({length:5}, () => 0.5 + Math.random());
  const sum = raw.reduce((a,b)=>a+b,0);
  bags = raw.map(r => ({ value: Math.round(r/sum*STAKE), hidden:false }));
  // fix rounding drift so values always total exactly 100
  bags[0].value += STAKE - bags.reduce((a,b)=>a+b.value,0);
  render();
}

function hiddenShare(){
  return bags.filter(b=>b.hidden).reduce((a,b)=>a+b.value,0)/STAKE;
}

function render(){
  const h = hiddenShare();
  bagsEl.innerHTML = '';
  bags.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'bag ' + (b.hidden ? 'hidden' : 'declared');
    el.innerHTML = `<div class="icon">${b.hidden ? '🥸' : '🧳'}</div>
                    <div class="val">${b.value}</div>
                    <div class="state">${b.hidden ? 'HIDDEN' : 'DECLARED'}</div>`;
    el.addEventListener('click', () => { if (!busy){ b.hidden = !b.hidden; render(); } });
    bagsEl.appendChild(el);
  });

  beltBags.innerHTML = '';
  bags.forEach(b => {
    const el = document.createElement('div');
    el.className = 'beltBag' + (b.hidden ? ' hid' : '');
    el.textContent = b.value;
    beltBags.appendChild(el);
  });

  oddsEl.innerHTML = h > 0
    ? `inspection <b>${(qOf(h)*100).toFixed(0)}%</b><br>hidden pays <b>${mhOf(h).toFixed(2)}x</b>`
    : `all declared<br><b>${(RTP*100).toFixed(0)}%</b> guaranteed`;
}

// --- tiny synthesized audio engine ---
let actx;
function audio(){ return actx || (actx = new (window.AudioContext||window.webkitAudioContext)()); }
function tone(freq, dur, type='sine', gain=0.15, when=0, freqEnd=null){
  const ctx = audio(); const t0 = ctx.currentTime + when;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, t0+dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g).connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function scanBeep(when=0){ tone(1600, 0.05, 'square', 0.05, when); }
function clack(){ tone(900, 0.03, 'square', 0.05); }
function cashRegister(){ tone(1500,0.05,'square',0.08,0); tone(1900,0.08,'square',0.08,0.08); [660,880,1100,1320].forEach((f,i)=>tone(f,0.2,'sine',0.1,0.16+i*0.06)); }
function klaxon(){ tone(480,0.55,'sawtooth',0.13,0,240); tone(480,0.55,'sawtooth',0.11,0.3,240); }

function animateCount(el, to, prefix, dur=450){
  const t0 = performance.now();
  (function frame(now){
    const t = Math.min(1, (now-t0)/dur);
    el.textContent = prefix + (to*(1-Math.pow(1-t,3))).toFixed(0);
    if (t < 1) requestAnimationFrame(frame);
  })(performance.now());
}

function pushHistory(cleared){
  const i = document.createElement('i');
  i.className = cleared ? 'clear' : 'seize';
  historyEl.appendChild(i);
  while (historyEl.children.length > 26) historyEl.removeChild(historyEl.firstChild);
}

betBtn.addEventListener('click', () => {
  if (balance < STAKE || busy) return;
  busy = true; betBtn.disabled = true;

  const h = hiddenShare(), d = 1-h;
  const q = qOf(h), mh = mhOf(h);

  flash.style.opacity = 0;
  scanBar.classList.remove('sweep'); void scanBar.offsetWidth;
  scanBar.classList.add('sweep');
  for (let i=0;i<6;i++) scanBeep(i*0.08);

  setTimeout(() => {
    const inspected = Math.random() < q;
    const seized = h > 0 && inspected;
    const payout = d*STAKE*RTP + (seized ? 0 : h*STAKE*mh);

    balance += payout - STAKE;
    wagered += STAKE; paid += payout; rounds++;
    pushHistory(!seized);

    flash.style.background = seized ? 'rgba(224,71,91,.4)' : 'rgba(62,201,143,.32)';
    if (seized){
      flash.textContent = 'SEIZED';
      klaxon();
    } else {
      flash.innerHTML = 'CLEARED <span id="amt">+0</span>';
      cashRegister();
      animateCount(document.getElementById('amt'), payout, '+');
    }
    flash.style.opacity = 1;
    setTimeout(()=>flash.style.opacity=0, 700);

    roundEl.textContent = rounds + 1;
    document.getElementById('balance').textContent = balance.toFixed(0);
    document.getElementById('rounds').textContent = rounds;
    document.getElementById('rtp').textContent = (100*paid/wagered).toFixed(1)+'%';

    busy = false; betBtn.disabled = false;
    setTimeout(dealBags, 500);
  }, 500);
});

// --- honesty check ---
function simulate(hidePolicy, n){
  let total = 0;
  for (let i=0;i<n;i++){
    const raw = Array.from({length:5}, () => 0.5 + Math.random());
    const sum = raw.reduce((a,b)=>a+b,0);
    const vals = raw.map(r => r/sum);
    const hidden = vals.filter(() => hidePolicy());
    const h = hidden.reduce((a,b)=>a+b,0), d = 1-h;
    const q = qOf(h);
    total += d*RTP + ((h>0 && Math.random()>=q) ? h*mhOf(h) : 0);
  }
  return total/n;
}
window.addEventListener('load', () => {
  dealBags();
  const n = 300000;
  const none  = simulate(()=>false, n);
  const half  = simulate(()=>Math.random()<0.5, n);
  const all   = simulate(()=>true, n);
  document.getElementById('debug').innerHTML =
    `Declared RTP: <b>${(RTP*100).toFixed(1)}%</b> — flat across <i>every</i> split, since the hidden multiplier is defined as RTP/(1−q).<br>
     (n=${n.toLocaleString()} each)<br>
     hide nothing → <span class="ok">${(none*100).toFixed(2)}%</span><br>
     hide at random → <span class="ok">${(half*100).toFixed(2)}%</span><br>
     hide everything → <span class="ok">${(all*100).toFixed(2)}%</span><br>
     The split is a pure volatility dial — it cannot move the house edge.`;
});
</script>
</body>
</html>
